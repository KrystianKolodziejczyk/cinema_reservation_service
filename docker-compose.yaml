services:
  nginx:
    container_name: cinema-rev-proxy
    image: nginx:alpine
    ports:
      - 80:80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_started
  app:
    build: .
    expose:
      - 8080
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    depends_on:
      db:
        condition: service_healthy
  db:
    container_name: cinema_database
    image: postgres:18-alpine
    env_file:
       - .env
    ports:
      - 8000:5432 # TODO: zmień na expose na produkcji
    volumes:
      - pgdata:/var/lib/posgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d cinema_database"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: